name: Testar escrita no repositório

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/teste-escrita.yml"]

permissions:
  contents: write

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar se o token consegue escrever
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan teste-escrita
          git rm -rf . --quiet || true
          echo "teste" > teste.txt
          git add teste.txt
          git commit -m "teste de escrita"
          git push origin teste-escrita 2>&1 | tail -5
          git push origin --delete teste-escrita 2>&1 | tail -3 || true
