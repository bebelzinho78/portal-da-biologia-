name: Publicar no GitHub Pages (Actions)

# Alternativa à publicação pela branch gh-pages.
# Ative em: Settings > Pages > Build and deployment > Source: "GitHub Actions"
# e depois execute este workflow manualmente (Actions > Publicar no GitHub Pages
# > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o portal
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fazer o checkout do código
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publicar os arquivos do portal
        id: deployment
        uses: actions/deploy-pages@v4
