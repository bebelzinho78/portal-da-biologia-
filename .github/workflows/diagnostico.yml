name: Diagnóstico de permissões

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/diagnostico.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Ver o que o token do workflow consegue fazer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== token =="
          echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
          echo "== permissões do repositório =="
          gh api "repos/${{github.repository}}" --jq '.permissions' 2>&1 || true
          echo "== GET pages =="
          gh api "repos/${{github.repository}}/pages" 2>&1 || true
          echo "== POST pages (build_type=workflow) =="
          gh api -X POST "repos/${{github.repository}}/pages" -f build_type=workflow 2>&1 || true
          echo "== POST pages (classic) =="
          gh api -X POST "repos/${{github.repository}}/pages" -f source[branch]=main -f source[path]=/ 2>&1 || true
          echo "== PUT workflow permissions =="
          gh api -X PUT "repos/${{github.repository}}/actions/permissions/workflow" -f default_workflow_permissions=write 2>&1 || true
          echo "== GET pages novamente =="
          gh api "repos/${{github.repository}}/pages" 2>&1 || true
